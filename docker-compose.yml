version: "3.9"

# =============================================================================
# docker-compose.yml – ModResorts Application (single service)
# NOTE: Only the application container is defined here.
#       All external services (databases, caches, etc.) are provided separately
#       and connected via environment variables.
# =============================================================================

services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      # JVM tuning
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      TZ: "UTC"
      # Redis / Google Cloud Memorystore connection (provide at runtime)
      REDIS_HOST: "${REDIS_HOST:-localhost}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      # Weather Underground API key (provide at runtime)
      WUNDERGROUND_API_KEY: "${WUNDERGROUND_API_KEY:-}"
    volumes:
      - modresorts-logs:/opt/tomcat/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  modresorts-logs:
    driver: local
