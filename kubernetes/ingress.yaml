apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modresorts-ingress
  namespace: modresorts
  labels:
    app: modresorts
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /modresorts/health
    alb.ingress.kubernetes.io/healthcheck-port: "9080"
spec:
  rules:
    - host: modresorts.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modresorts-service
                port:
                  number: 80
